name: Build CUDA Runtime Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_REF: "72797e891"
  CUDA_IMAGE: "nvidia/cuda:12.8.1-devel-ubuntu24.04"

jobs:
  cuda-runtime:
    name: CUDA 12.8 runtime / RTX 30 test
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build self-contained llama-server CUDA runtime
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/runtime-cuda-test"
          mkdir -p "$GITHUB_WORKSPACE/runtime-cuda-test"

          docker run --rm \
            -e LLAMA_CPP_REF="$LLAMA_CPP_REF" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$CUDA_IMAGE" \
            bash -s <<'CUDA_BUILD_SCRIPT'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates cmake build-essential git file binutils

          WORK=/tmp/flameshot-ocr-llama-cuda
          rm -rf "$WORK"
          mkdir -p "$WORK"

          echo "CUDA compiler:"
          nvcc --version

          echo
          echo "Building llama.cpp revision: $LLAMA_CPP_REF"
          git clone --filter=blob:none \
            https://github.com/ggml-org/llama.cpp.git \
            "$WORK/llama.cpp"
          git -C "$WORK/llama.cpp" checkout "$LLAMA_CPP_REF"

          cmake \
            -S "$WORK/llama.cpp" \
            -B "$WORK/build-cuda" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=86

          cmake --build "$WORK/build-cuda" \
            --target llama-server \
            -j"$(nproc)"

          mkdir -p /workspace/runtime-cuda-test/lib

          cp "$WORK/build-cuda/bin/llama-server" \
            /workspace/runtime-cuda-test/llama-server-cuda.bin
          chmod 0755 /workspace/runtime-cuda-test/llama-server-cuda.bin

          if command -v strip >/dev/null 2>&1; then
            strip --strip-unneeded \
              /workspace/runtime-cuda-test/llama-server-cuda.bin || true
          fi

          # Bundle CUDA user-space libraries required by llama-server.
          # libcuda.so.1 is intentionally not bundled; it is supplied by
          # the host NVIDIA driver.
          ldd /workspace/runtime-cuda-test/llama-server-cuda.bin \
            | awk '$3 ~ "^/usr/local/cuda/" { print $3 }' \
            | sort -u \
            > /tmp/flameshot-cuda-libs.txt

          while IFS= read -r lib; do
            [[ -n "$lib" ]] || continue
            cp -L "$lib" /workspace/runtime-cuda-test/lib/
          done < /tmp/flameshot-cuda-libs.txt

          cat > /workspace/runtime-cuda-test/llama-server-cuda <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$DIR/llama-server-cuda.bin" "$@"
          WRAPPER
          sed -i 's/^          //' /workspace/runtime-cuda-test/llama-server-cuda
          chmod 0755 /workspace/runtime-cuda-test/llama-server-cuda

          nvcc --version \
            > /workspace/runtime-cuda-test/cuda-toolkit.txt

          {
            echo "llama.cpp revision: $LLAMA_CPP_REF"
            echo "CUDA image: nvidia/cuda:12.8.1-devel-ubuntu24.04"
            echo "CUDA architectures: 86"
            echo "Build shared libs: OFF"
            echo "GGML CUDA: ON"
          } > /workspace/runtime-cuda-test/build-info.txt

          {
            echo "Bundled CUDA user-space libraries:"
            find /workspace/runtime-cuda-test/lib \
              -maxdepth 1 -type f -printf "%f\n" | sort
            echo
            echo "Host requirement:"
            echo "libcuda.so.1 from the NVIDIA driver"
          } > /workspace/runtime-cuda-test/bundled-libs.txt

          LD_LIBRARY_PATH=/workspace/runtime-cuda-test/lib \
            ldd /workspace/runtime-cuda-test/llama-server-cuda.bin \
            > /workspace/runtime-cuda-test/ldd-build.txt || true

          file /workspace/runtime-cuda-test/llama-server-cuda.bin \
            > /workspace/runtime-cuda-test/file-info.txt

          chmod -R a+rX /workspace/runtime-cuda-test
          CUDA_BUILD_SCRIPT

          echo
          echo "===== CUDA test runtime ====="
          du -sh "$GITHUB_WORKSPACE/runtime-cuda-test"
          find "$GITHUB_WORKSPACE/runtime-cuda-test" \
            -maxdepth 2 -type f -printf "%p\t%k KB\n" | sort

          echo
          echo "===== Bundled CUDA libraries ====="
          cat "$GITHUB_WORKSPACE/runtime-cuda-test/bundled-libs.txt"

          echo
          echo "===== Dependencies with bundled libraries ====="
          cat "$GITHUB_WORKSPACE/runtime-cuda-test/ldd-build.txt"

          echo
          echo "===== SHA256 ====="
          (
            cd "$GITHUB_WORKSPACE/runtime-cuda-test"
            sha256sum llama-server-cuda llama-server-cuda.bin lib/* \
              | tee SHA256SUMS
          )

      - name: Upload CUDA test artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flameshot-OCR-CUDA12.8-sm86-selfcontained-${{ github.sha }}
          path: runtime-cuda-test/
          if-no-files-found: error
          retention-days: 3
