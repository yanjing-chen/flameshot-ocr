name: Build AppImage and deb

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'paddleocr-vl-v*'
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  OCR_VERSION: "2.5"
  LLAMA_CPP_REF: "72797e891"

jobs:
  appimage:
    name: AppImage x86_64
    runs-on: ubuntu-latest
    container:
      image: quay.io/flameshot-org/ci-building:ubuntu-noble
      options: --cap-add SYS_ADMIN --device /dev/fuse --security-opt apparmor:unconfined

    steps:
      - name: Configure git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == paddleocr-vl-v* ]]; then
            VERSION="${GITHUB_REF_NAME#paddleocr-vl-v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${OCR_VERSION}+git.${GITHUB_SHA::8}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get -y -qq update
          sudo apt-get -y --no-install-recommends install \
            fuse cmake extra-cmake-modules build-essential git wget \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6svg6-dev qt6-l10n-tools qt6-translations-l10n qt6-wayland libgl-dev \
            appstream hicolor-icon-theme openssl ca-certificates jq zstd \
            libvulkan-dev glslc spirv-headers

      - name: Build OCR runtimes
        shell: bash
        run: bash scripts/build-ocr-runtimes.sh "$GITHUB_WORKSPACE/runtime-build"

      - name: Download linuxdeploy
        shell: bash
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build Flameshot OCR
        shell: bash
        run: |
          cmake -S . -B build-appimage \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DUSE_LAUNCHER_ABSOLUTE_PATH:BOOL=OFF
          cmake --build build-appimage -j"$(nproc)"

      - name: Create AppDir
        shell: bash
        run: |
          APPDIR="$GITHUB_WORKSPACE/FlameshotOCR.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"

          DESTDIR="$APPDIR" cmake --install build-appimage

          # Fail the AppImage build immediately if Flameshot translations were
          # not installed into the portable AppDir.
          test -s "$APPDIR/usr/share/flameshot/translations/Internationalization_zh_CN.qm"
          echo "AppImage translation payload:"
          ls -lh "$APPDIR/usr/share/flameshot/translations/Internationalization_zh_CN.qm"

          # QTranslator loads qt_zh_CN.qm by name. linuxdeploy-plugin-qt
          # may deploy qtbase_zh_CN.qm without the top-level Qt catalog.
          test -s /usr/share/qt6/translations/qt_zh_CN.qm
          install -Dm0644 /usr/share/qt6/translations/qt_zh_CN.qm \
            "$APPDIR/usr/translations/qt_zh_CN.qm"

          rm -rf "$APPDIR/usr/include"
          rm -rf "$APPDIR/usr/lib"

          mkdir -p "$APPDIR/usr/lib/flameshot-ocr/runtime"

          # Qt's OpenSSL TLS backend loads libssl dynamically. linuxdeploy can
          # include libcrypto without libssl, causing a host/AppImage OpenSSL
          # version mismatch on newer Ubuntu releases. Bundle libssl.so.3 and
          # libcrypto.so.3 from the SAME build image.
          MULTIARCH="$(gcc -print-multiarch)"
          SSL_LIB="/usr/lib/${MULTIARCH}/libssl.so.3"
          CRYPTO_LIB="/usr/lib/${MULTIARCH}/libcrypto.so.3"

          test -s "$SSL_LIB"
          test -s "$CRYPTO_LIB"

          mkdir -p "$APPDIR/usr/lib"
          cp -L "$SSL_LIB" "$APPDIR/usr/lib/libssl.so.3"
          cp -L "$CRYPTO_LIB" "$APPDIR/usr/lib/libcrypto.so.3"

          echo "Bundled OpenSSL libraries:"
          ls -lh "$APPDIR/usr/lib/libssl.so.3" "$APPDIR/usr/lib/libcrypto.so.3"
          cp runtime-build/llama-server-vulkan \
             "$APPDIR/usr/lib/flameshot-ocr/runtime/llama-server-vulkan"
          cp runtime-build/llama-server-cpu \
             "$APPDIR/usr/lib/flameshot-ocr/runtime/llama-server-cpu"

          # CUDA Runtime Manager downloads a .tar.zst archive. Bundle zstd so
          # the AppImage does not depend on the host having zstd installed.
          # Keep this tool separate from the llama runtimes because it is only
          # used for installing/updating optional CUDA support.
          ZSTD_BIN="$(command -v zstd)"
          test -x "$ZSTD_BIN"

          mkdir -p "$APPDIR/usr/lib/flameshot-ocr/tools"
          cp -L "$ZSTD_BIN" \
             "$APPDIR/usr/lib/flameshot-ocr/tools/zstd"
          chmod 0755 "$APPDIR/usr/lib/flameshot-ocr/tools/zstd"

          # zstd on Ubuntu Noble uses these small non-system libraries.
          # Do not bundle glibc or the dynamic loader.
          for ZSTD_LIB in libz.so.1 liblzma.so.5 liblz4.so.1 libxxhash.so.0; do
            ZSTD_LIB_PATH="$(ldconfig -p | awk -v lib="$ZSTD_LIB" \
              '$1 == lib && $4 ~ /^\/.*x86_64-linux-gnu/ { print $4; exit }')"
            test -n "$ZSTD_LIB_PATH"
            test -s "$ZSTD_LIB_PATH"
            cp -L "$ZSTD_LIB_PATH" "$APPDIR/usr/lib/$ZSTD_LIB"
          done

          echo "Bundled CUDA extraction tool:"
          ls -lh "$APPDIR/usr/lib/flameshot-ocr/tools/zstd"
          echo "Bundled zstd libraries:"
          ls -lh \
            "$APPDIR/usr/lib/libz.so.1" \
            "$APPDIR/usr/lib/liblzma.so.5" \
            "$APPDIR/usr/lib/liblz4.so.1" \
            "$APPDIR/usr/lib/libxxhash.so.0"

          # Build-time sanity check: the packaged zstd must actually execute
          # using the AppDir libraries.
          LD_LIBRARY_PATH="$APPDIR/usr/lib" \
            "$APPDIR/usr/lib/flameshot-ocr/tools/zstd" --version

          mkdir -p "$APPDIR/usr/share/doc/flameshot-ocr"
          cp THIRD_PARTY_NOTICES.md \
             "$APPDIR/usr/share/doc/flameshot-ocr/THIRD_PARTY_NOTICES.md"

      - name: Package AppImage
        shell: bash
        run: |
          export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so"
          export EXTRA_QT_MODULES="waylandcompositor"
          export QMAKE=/usr/lib/qt6/bin/qmake
          export OUTPUT="$GITHUB_WORKSPACE/Flameshot-OCR-${VERSION}-x86_64.AppImage"

          ./linuxdeploy-x86_64.AppImage \
            --appdir "$GITHUB_WORKSPACE/FlameshotOCR.AppDir" \
            --plugin qt \
            --output appimage

          test -s "$OUTPUT"

          # Treat translations and product identity as release gates.
          VERIFY_DIR="$GITHUB_WORKSPACE/appimage-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          (
            cd "$VERIFY_DIR"
            "$OUTPUT" --appimage-extract >/dev/null
          )

          APPROOT="$VERIFY_DIR/squashfs-root"

          test -s \
            "$APPROOT/usr/share/flameshot/translations/Internationalization_zh_CN.qm"

          test -s \
            "$APPROOT/usr/translations/qt_zh_CN.qm"

          VERSION_OUTPUT="$(
            TEST_CONFIG_HOME="$VERIFY_DIR/config"
            mkdir -p "$TEST_CONFIG_HOME/flameshot"
            printf '[General]\\nuiLanguage=zh_CN\\n' \
              > "$TEST_CONFIG_HOME/flameshot/flameshot.ini"

            LANG=zh_CN.UTF-8 \
            LANGUAGE=zh_CN \
            XDG_CONFIG_HOME="$TEST_CONFIG_HOME" \
            QT_QPA_PLATFORM=offscreen \
              "$OUTPUT" --appimage-extract-and-run --version 2>&1
          )"

          printf '%s\n' "$VERSION_OUTPUT"

          ! grep -Fq \
            "No Qt translation found" \
            <<<"$VERSION_OUTPUT"

          grep -Fq \
            "Flameshot OCR v2.5 (based on Flameshot v14.0.0, ${GITHUB_SHA::8})" \
            <<<"$VERSION_OUTPUT"

          (
            cd "$(dirname "$OUTPUT")"
            sha256sum "$(basename "$OUTPUT")"
          ) | tee "${OUTPUT}.sha256sum"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flameshot-OCR-${{ env.VERSION }}-AppImage-x86_64
          path: |
            Flameshot-OCR-*.AppImage
            Flameshot-OCR-*.AppImage.sha256sum
          if-no-files-found: error

  deb:
    name: deb Ubuntu 24.04 amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == paddleocr-vl-v* ]]; then
            VERSION="${GITHUB_REF_NAME#paddleocr-vl-v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${OCR_VERSION}+git.${GITHUB_SHA::8}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Install runtime-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential git libvulkan-dev glslc spirv-headers

      - name: Build OCR runtimes
        shell: bash
        run: bash scripts/build-ocr-runtimes.sh "$GITHUB_WORKSPACE/runtime-build"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout Flameshot packpack
        uses: actions/checkout@v6
        with:
          repository: flameshot-org/packpack
          path: .packpack
          ref: multiarch

      - name: Build upstream-style deb
        shell: bash
        run: |
          rm -rf debian
          cp -r packaging/debian debian

          export OS=ubuntu
          export DIST=noble
          export DOCKER_ARCH=amd64
          export ARCH=amd64
          export GIT_HASH="$(git rev-parse --short HEAD)"
          export PRESERVE_ENVVARS="GIT_HASH"

          bash .packpack/packpack

          echo "Produced packages:"
          find build -maxdepth 1 -type f -name '*.deb' -print

      - name: Inject OCR runtimes and rename package
        shell: bash
        run: |
          SRC_DEB="$(find build -maxdepth 1 -type f \
            -name 'flameshot_*_amd64.deb' \
            ! -name '*dbgsym*' \
            ! -name '*dbg*' \
            | head -n 1)"

          if [[ -z "$SRC_DEB" ]]; then
            echo "Could not find the generated Flameshot deb."
            exit 1
          fi

          ROOT="$RUNNER_TEMP/flameshot-ocr-deb-root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          dpkg-deb -R "$SRC_DEB" "$ROOT"

          mkdir -p "$ROOT/usr/lib/flameshot-ocr/runtime"
          cp runtime-build/llama-server-vulkan \
             "$ROOT/usr/lib/flameshot-ocr/runtime/llama-server-vulkan"
          cp runtime-build/llama-server-cpu \
             "$ROOT/usr/lib/flameshot-ocr/runtime/llama-server-cpu"

          mkdir -p "$ROOT/usr/share/doc/flameshot-ocr"
          cp THIRD_PARTY_NOTICES.md \
             "$ROOT/usr/share/doc/flameshot-ocr/THIRD_PARTY_NOTICES.md"

          export CONTROL="$ROOT/DEBIAN/control"
          python3 <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["CONTROL"])
          version = os.environ["VERSION"]
          lines = path.read_text(encoding="utf-8").splitlines()

          out = []
          seen = set()

          for line in lines:
              if line.startswith("Package:"):
                  out.append("Package: flameshot-ocr")
                  seen.add("Package")
              elif line.startswith("Version:"):
                  safe_version = version.replace("+", "~")
                  out.append(f"Version: {safe_version}-1")
                  seen.add("Version")
              elif line.startswith("Depends:"):
                  deps = line[len("Depends:"):].strip()
                  extras = ["libvulkan1", "qt6-wayland", "ca-certificates", "zstd"]
                  for dep in extras:
                      if dep not in deps:
                          deps = f"{deps}, {dep}" if deps else dep
                  out.append(f"Depends: {deps}")
                  seen.add("Depends")
              elif line.startswith(("Conflicts:", "Replaces:", "Provides:")):
                  continue
              else:
                  out.append(line)

          out.extend([
              "Conflicts: flameshot",
              "Replaces: flameshot",
              "Provides: flameshot",
          ])

          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

          OUT_DEB="$GITHUB_WORKSPACE/flameshot-ocr_${VERSION}_amd64.deb"
          dpkg-deb --build --root-owner-group "$ROOT" "$OUT_DEB"

          dpkg-deb -I "$OUT_DEB"
          (
            cd "$(dirname "$OUT_DEB")"
            sha256sum "$(basename "$OUT_DEB")"
          ) | tee "${OUT_DEB}.sha256sum"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: Flameshot-OCR-${{ env.VERSION }}-deb-ubuntu-24.04-amd64
          path: |
            flameshot-ocr_*_amd64.deb
            flameshot-ocr_*_amd64.deb.sha256sum
          if-no-files-found: error
